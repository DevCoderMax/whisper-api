version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
handlers:
  file_handler:
    class: logging.handlers.RotatingFileHandler
    filename: app.log
    maxBytes: 10485760 # 10MB
    backupCount: 5
    formatter: default
loggers:
  uvicorn:
    level: INFO
    handlers: [file_handler]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [file_handler]
    propagate: false